[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "object-graph-performance-lab"
version = "0.1.0"
description = "An object-graph performance lab. Later work stays in this repository."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shina Patel" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
